[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aimux"
version = "0.1.23"
description = "AI-agent-friendly tmux wrapper: unified local + remote sessions, single-pane sessions, safe primitives."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "aimux" }]
dependencies = [
    "click>=8",
    "loguru>=0.7",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[project.scripts]
aimux = "aimux.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aimux"]

[tool.hatch.build.targets.wheel.force-include]
"src/aimux/aimux.conf" = "aimux/aimux.conf"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that touch a real SSH endpoint",
]
